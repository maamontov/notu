[package]
name = "notu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, local Markdown notes in your terminal"
repository = "https://github.com/maamontov/notu"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9", features = ["search"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tui-markdown = { version = "0.3.10", default-features = false }
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
